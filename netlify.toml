# RECOVIA — sous-domaine de paiement
# Affiche la page de règlement à la racine de payer.recovia-france.fr
# sans modifier l'URL visible et sans affecter le domaine principal.

[[redirects]]
  from = "/"
  to = "/regler-un-dossier.html"
  status = 200
  force = true
  conditions = { Host = ["payer.recovia-france.fr"] }
